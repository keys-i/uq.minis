target-version = "py312"
line-length = 100
cache-dir = ".cache/ruff"
src = ["src", "tools", "tests"]
extend-exclude = ["generated", "_render"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["D"]
ignore = ["D400", "D415"] # Docstring summaries intentionally omit final punctuation

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
"tests/**" = ["D"]

[lint.isort]
known-first-party = ["uq_minis", "uq_minis_tools"]

[format]
line-ending = "lf"
