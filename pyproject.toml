[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "uq-minis"
version = "0.32.0"
description = "Fast UQ and UQU event automations driven by TOML"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{ name = "keys-i" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "python-docx>=1.2,<2",
  "python-dotenv>=1.1,<2",
  "prompt-toolkit>=3.0.52,<4",
  "rich>=14.2,<16",
  "typer>=0.27.2,<1",
]

[project.optional-dependencies]
auth = ["playwright>=1.55,<2"]
agent = ["msal>=1.31,<2", "playwright>=1.55,<2"]
timey = [
  "pillow>=12.1,<13",
  "yt-dlp[default]>=2026.3.17",
  "google-api-python-client>=2.190,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
mini = "uq_minis.cli:main"
dev = "uq_minis_tools.scripts.script:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "greenlet>=3.1,<4",
  "ruff>=0.16.6,<1",
  "pyyaml>=6,<7",
  "basedpyright>=1.40.2,<2",
  "types-pyyaml>=6.0.12.20260906",
  "lxml-stubs>=0.5.1",
]
security = [
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.9,<3",
]
release = ["twine>=6.2,<7"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py315"
preview = true
line-length = 100
cache-dir = ".cache/ruff"
src = ["src", "tools", "tests"]
extend-exclude = ["generated", "_render"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["D"]
ignore = ["D400", "D415"] # Docstring summaries intentionally omit final punctuation

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["uq_minis", "uq_minis_tools"]

[tool.ruff.format]
line-ending = "lf"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["src", "tools", "tests", "docs/assets/terminal/sculpt.py"]

# White-box tests intentionally inspect internal state and recovery paths
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[tool.setuptools.package-dir]
"" = "src"
uq_minis = "src"
uq_minis_tools = "tools"
"uq_minis.assets" = "docs/assets"
"uq_minis.skills" = "skills"

[tool.setuptools.package-data]
uq_minis = ["py.typed", "core/*.toml"]
uq_minis_tools = ["py.typed", "config/*.toml"]
"uq_minis.assets" = ["*.png", "terminal/*.toml", "event/*.gz", "timey/fonts/*.ttf", "timey/fonts/*.txt", "timey/art/*.png", "timey/art/*.md"]
"uq_minis.skills" = ["*/SKILL.md"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
data_file = ".cache/.coverage"
branch = true
source = ["uq_minis", "uq_minis_tools"]
concurrency = ["thread", "greenlet", "multiprocessing"]
patch = ["subprocess"]

[tool.coverage.xml]
output = ".cache/coverage.xml"

[tool.coverage.html]
directory = ".cache/htmlcov"

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
