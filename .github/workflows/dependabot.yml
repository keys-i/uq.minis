# -- dependabot/fetch-metadata v3.1.0 --
# SHA: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98
name: dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      compatibility: ${{ steps.read.outputs.compatibility-score }}
      update-type: ${{ steps.read.outputs.update-type }}
      ecosystem: ${{ steps.read.outputs.package-ecosystem }}
      maintainer-changes: ${{ steps.read.outputs.maintainer-changes }}
    steps:
      - name: Read compatibility metadata
        id: read
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          compat-lookup: true
          github-token: ${{ secrets.DEPENDABOT_METADATA_TOKEN }}

  auto-merge:
    needs: metadata
    if: >-
      needs.metadata.outputs.compatibility != '' &&
      fromJSON(needs.metadata.outputs.compatibility) > 80 &&
      needs.metadata.outputs.maintainer-changes == 'false' &&
      needs.metadata.outputs.ecosystem == 'pip' &&
      contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), needs.metadata.outputs.update-type)
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
