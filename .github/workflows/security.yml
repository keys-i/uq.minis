# SHA: 3d3c42e5aac5ba805825da76410c181273ba90b1
# -- astral-sh/setup-uv v10.0.1 --
# SHA: 20cfd1bf945f4377ade1205e4dbc17946fc9a30d
# -- actions/dependency-review-action v5.0.0 --
# SHA: a1d282b36b6f3519aa1f3fc636f609c47dddb294
# -- github/codeql-action v4.37.9 --
# SHA: cdf488f595d80d6e07e03d4674febd5ab45fa938
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync security tools
        run: uv sync --locked --all-extras --no-default-groups --group security

      - name: Scan source and dependencies
        run: uv run --no-sync dev security

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialise Python CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: python

      - name: Analyse Python
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:python
